[package]
name = "file-organizer"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["ui"]
ui = ["dep:gpui"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
walkdir = "2"
trash = "5"
gpui = { version = "=0.2.2", optional = true }

[dev-dependencies]
tempfile = "3"
gpui = { version = "=0.2.2", features = ["test-support"] }

[[bin]]
name = "file-organizer"
path = "src/main.rs"
required-features = ["ui"]

[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
